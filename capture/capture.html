<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Window Capture with DevTools</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 24px;
      user-select: none;
    }
    .status-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-radius: 50%;
      border-top-color: #38bdf8;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #f1f5f9;
    }
    p {
      font-size: 12.5px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .countdown-text {
      font-size: 14px;
      font-weight: 600;
      color: #38bdf8;
      margin: 10px 0;
    }
    .tip-box {
      margin-top: 14px;
      background: #1e293b;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
    }
    .tip-box strong {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div id="countdown-indicator" class="status-icon">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12 6 12 12 16 14"></polyline>
    </svg>
  </div>
  <div id="loading-spinner" class="spinner" style="display: none;"></div>

  <h2 id="status-title">Switching to your tab...</h2>
  <div id="countdown-text" class="countdown-text">Prompt opens in 2s</div>
  <p id="status-desc">Keep your working tab visible with DevTools open.</p>

  <div class="tip-box">
    In the prompt: click <strong>"Window"</strong> &rarr; select your Chrome window &rarr; click <strong>Share</strong>.
  </div>

  <script src="capture.js"></script>
</body>
</html>
