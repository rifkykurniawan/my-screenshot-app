<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Window Capture with DevTools</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-radius: 50%;
      border-top-color: #38bdf8;
      animation: spin 0.8s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #f1f5f9;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      max-width: 320px;
      line-height: 1.5;
    }
    .instructions {
      margin-top: 16px;
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .instructions strong {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Select Chrome Window</h2>
  <p>In the browser prompt, select your Chrome window and click <strong>Share</strong>.</p>
  <div class="instructions">
    Tip: Switch to the <strong>"Window"</strong> tab in the prompt and pick your Chrome window with DevTools.
  </div>

  <script src="capture.js"></script>
</body>
</html>
