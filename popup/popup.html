<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Snap Menu</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="logo-title">
        <svg class="icon-camera" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span class="app-title">Screen Snap</span>
      </div>
      <span class="badge">v1.1</span>
    </div>

    <div class="modes-list" id="modes-list">
      <!-- Mode 1: Normal Viewport Capture -->
      <button class="mode-card" id="btn-mode-normal" type="button">
        <div class="mode-icon-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <div class="mode-details">
          <div class="mode-name">Normal Viewport</div>
          <div class="mode-desc">Capture active tab webpage area</div>
        </div>
        <div class="shortcut-tag">Alt+Shift+S</div>
      </button>

      <!-- Mode 2: DevTools & Window Capture -->
      <button class="mode-card highlight" id="btn-mode-devtools" type="button">
        <div class="mode-icon-wrapper devtools-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          </svg>
        </div>
        <div class="mode-details">
          <div class="mode-name">Include DevTools</div>
          <div class="mode-desc">Capture full window with DevTools panel</div>
        </div>
        <div class="shortcut-tag">Alt+Shift+W</div>
      </button>

      <!-- Mode 3: Select-area Capture -->
      <button class="mode-card" id="btn-mode-area" type="button">
        <div class="mode-icon-wrapper area-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7V5a1 1 0 0 1 1-1h2"></path>
            <path d="M17 4h2a1 1 0 0 1 1 1v2"></path>
            <path d="M20 17v2a1 1 0 0 1-1 1h-2"></path>
            <path d="M7 20H5a1 1 0 0 1-1-1v-2"></path>
            <line x1="12" y1="9" x2="12" y2="15"></line>
            <line x1="9" y1="12" x2="15" y2="12"></line>
          </svg>
        </div>
        <div class="mode-details">
          <div class="mode-name">Select Area</div>
          <div class="mode-desc">Drag a region of the page to capture</div>
        </div>
        <div class="shortcut-tag">Alt+Shift+R</div>
      </button>

      <!-- Mode 4: Full-page Capture -->
      <button class="mode-card" id="btn-mode-fullpage" type="button">
        <div class="mode-icon-wrapper fullpage-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <polyline points="9 11 12 8 15 11"></polyline>
            <polyline points="9 13 12 16 15 13"></polyline>
          </svg>
        </div>
        <div class="mode-details">
          <div class="mode-name">Full Page</div>
          <div class="mode-desc">Scroll and capture the entire page</div>
        </div>
        <div class="shortcut-tag">Alt+Shift+F</div>
      </button>
    </div>

    <div class="popup-footer">
      <span>Pick Chrome window when prompted</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
